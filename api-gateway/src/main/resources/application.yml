server:
   port: 9900

spring:
   application:
      name: api-gateway
   cloud:
      gateway:
         server:
            webflux:
               routes:
               -  id: inventory-service
                  uri: lb://INVENTORY-SERVICE # ✅ service discovery version
                  predicates:
                  - Path=/api/v1/inventory/**

               -  id: user-service
                  uri: lb://USER-SERVICE # ✅ service discovery version
                  predicates:
                  - Path=/api/users/**

               -  id: product-service
                  uri: lb://PRODUCT-SERVICE # ✅ service discovery version
                  predicates:
                  - Path=/api/products/**,/api/categories/**


               -  id: cart-service
                  uri: lb://CART-SERVICE # ✅ service discovery version
                  predicates:
                  - Path=/api/cart/**

eureka:
   client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
         defaultZone: http://localhost:8761/eureka
   instance:
      prefer-ip-address: true
      hostname: localhost